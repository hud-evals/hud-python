name: Pre-release

# The release gate (release.yml) looks up a successful run of this workflow on the
# tagged commit, so keep its file name and trigger.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  templates:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: pre-release
    timeout-minutes: 45
    concurrency:
      group: ci-example-${{ matrix.template }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        template: [blank, coding, cua, argument-hints]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      # The hosted test skips without credentials, which must not pass the gate.
      - name: Require credentials
        env:
          HUD_API_KEY: ${{ secrets.HUD_API_KEY }}
        run: test -n "$HUD_API_KEY"

      # hud init, install this checkout's SDK, deploy, run one rollout on the HUD
      # runtime with a live model, check its lifecycle, and read the trace back.
      - name: Deploy and run the template on HUD
        env:
          HUD_API_KEY: ${{ secrets.HUD_API_KEY }}
          HUD_CI_DATA_FILE_ID: ${{ vars.HUD_CI_DATA_FILE_ID }}
          HUD_E2E_TRACE_DIR: ${{ runner.temp }}/traces
        run: >-
          uv run --python 3.12 --all-extras
          pytest -m "e2e and hosted" -p no:cacheprovider -rs
          "tests/e2e/test_templates.py::test_a_deployed_template_runs_on_hud_and_its_trace_reads_back[${{ matrix.template }}]"

      - name: Save traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-traces-${{ matrix.template }}
          path: ${{ runner.temp }}/traces/${{ matrix.template }}
          retention-days: 7
