name: Pre-release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  templates:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: pre-release
    timeout-minutes: 45
    concurrency:
      group: ci-example-${{ matrix.template }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        template: [blank, coding, cua, argument-hints]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Require credentials
        env:
          HUD_API_KEY: ${{ secrets.HUD_API_KEY }}
        run: test -n "$HUD_API_KEY"

      - name: Deploy and run the template on HUD
        env:
          HUD_API_KEY: ${{ secrets.HUD_API_KEY }}
          HUD_CI_DATA_FILE_ID: ${{ vars.HUD_CI_DATA_FILE_ID }}
          HUD_E2E_TRACE_DIR: ${{ runner.temp }}/traces
        run: >-
          uv run --locked --python 3.12 --all-extras
          pytest -m "e2e and hosted" -p no:cacheprovider -rs
          "tests/e2e/test_templates.py::test_a_deployed_template_runs_on_hud_and_its_trace_reads_back[${{ matrix.template }}]"

      - name: Save traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-traces-${{ matrix.template }}
          path: ${{ runner.temp }}/traces/${{ matrix.template }}
          retention-days: 7

  live:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/live.yml
    secrets: inherit
