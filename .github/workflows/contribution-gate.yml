name: Contribution gate

# Pull requests from people without write access must close an issue that a
# maintainer has labelled `accepted`. Anything else is closed with a pointer to
# CONTRIBUTING.md. This runs on pull_request_target and never checks out the PR.

on:
  pull_request_target:
    types: [opened]

permissions:
  issues: read
  pull-requests: write

jobs:
  require-accepted-issue:
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Close PRs that do not fix an accepted issue
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$AUTHOR/permission" --jq .permission)
          if [ "$permission" = admin ] || [ "$permission" = write ]; then
            echo "$AUTHOR has $permission access; no accepted issue required."
            exit 0
          fi

          if gh api graphql \
              -F owner="${GITHUB_REPOSITORY%/*}" -F repo="${GITHUB_REPOSITORY#*/}" -F number="$PR_NUMBER" \
              -f query='query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    closingIssuesReferences(first: 10) {
                      nodes { repository { nameWithOwner } labels(first: 50) { nodes { name } } }
                    }
                  }
                }
              }' \
              --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[]
                | select(.repository.nameWithOwner == env.GITHUB_REPOSITORY) | .labels.nodes[].name' \
              | grep -qx accepted; then
            echo "Fixes an accepted issue."
            exit 0
          fi

          gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --comment "Thanks for the contribution! Outside pull requests must fix an issue a maintainer has labelled \`accepted\`; see [CONTRIBUTING.md](https://github.com/$GITHUB_REPOSITORY/blob/main/CONTRIBUTING.md#pull-request-process)."
