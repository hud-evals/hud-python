name: Release

on:
  release:
    types: [published]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Require pre-release validation for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          validated_run=$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/pre-release.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f branch=main \
            -f event=workflow_dispatch -f status=success \
            --jq '.workflow_runs[0].html_url // empty')
          if [ -z "$validated_run" ]; then
            echo "::error::Run Pre-release on main for commit $GITHUB_SHA before publishing."
            exit 1
          fi
          echo "Validated by $validated_run"

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Only 'hud' is published. The old 'hud-python' name is closed off by a
      # final PyPI release (0.6.10) that refuses to install and points at 'hud'.
      - name: Build and publish 'hud' to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          uv build
          uv publish

      # docs.hud.ai builds the SDK tab from the docs branch. Prereleases stay
      # off it: the branch tracks the latest stable release.
      - name: Point docs at this release
        if: ${{ !github.event.release.prerelease }}
        run: |
          git push --force origin "${GITHUB_SHA}:refs/heads/docs"
