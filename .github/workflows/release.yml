name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Stable version to release (X.Y.Z). Leave empty to publish this commit's dev build; a
          maintenance branch release/X.Y publishes X.Y.Z versions only.
        required: false
        type: string

permissions:
  contents: read

jobs:
  version:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      newest: ${{ steps.version.outputs.newest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d

      - name: Choose the version
        id: version
        env:
          RELEASE: ${{ inputs.version }}
        run: |
          stable() { git tag --list "$1" | grep -Ex 'v[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -n 1; }
          newer() { [ "$1" != "$2" ] && [ "$(printf '%s\n' "$1" "$2" | sort -V | tail -n 1)" = "$1" ]; }
          # A maintenance branch release/X.Y publishes its own line's stable versions only.
          tags='v*'
          if [[ "$GITHUB_REF" == refs/heads/release/* ]]; then
            line=${GITHUB_REF#refs/heads/release/}
            if ! [[ "$line" =~ ^[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Branch release/$line is not a maintenance branch; name it release/X.Y."
              exit 1
            fi
            if [[ "$RELEASE" != "$line".* ]]; then
              echo "::error::release/$line publishes stable $line.Z versions only; got '$RELEASE'."
              exit 1
            fi
            tags="v$line.*"
          fi
          if [ -n "$RELEASE" ]; then
            if ! [[ "$RELEASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Release version '$RELEASE' must be a stable X.Y.Z."
              exit 1
            fi
            latest=$(stable "$tags")
            if ! newer "v$RELEASE" "$latest"; then
              echo "::error::Release version $RELEASE must be newer than $latest."
              exit 1
            fi
            echo "version=${RELEASE}" >> "$GITHUB_OUTPUT"
            # The newest stable release of any line moves the docs and is GitHub's "Latest".
            if newer "v$RELEASE" "$(stable 'v*')"; then
              echo "newest=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          version=$(uvx --from hatchling --with hatch-vcs hatchling version)
          version=${version%%+*}
          case "$version" in *.dev*) echo "version=${version}" >> "$GITHUB_OUTPUT" ;; esac

  templates:
    needs: version
    runs-on: ubuntu-latest
    environment: pre-release
    timeout-minutes: 45
    concurrency:
      group: ci-example-${{ matrix.template }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        template: [blank, coding, cua, argument-hints]

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d

      - name: Require credentials
        env:
          HUD_API_KEY: ${{ secrets.HUD_API_KEY }}
        run: test -n "$HUD_API_KEY"

      - name: Deploy and run the template on HUD
        env:
          HUD_API_KEY: ${{ secrets.HUD_API_KEY }}
          HUD_CI_DATA_FILE_ID: ${{ vars.HUD_CI_DATA_FILE_ID }}
          HUD_E2E_TRACE_DIR: ${{ runner.temp }}/traces
        run: >-
          uv run --locked --python 3.12 --all-extras
          pytest -m "e2e and hosted" -p no:cacheprovider -rs
          "tests/e2e/test_templates.py::test_a_deployed_template_runs_on_hud_and_its_trace_reads_back[${{ matrix.template }}]"

      - name: Save traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: example-traces-${{ matrix.template }}
          path: ${{ runner.temp }}/traces/${{ matrix.template }}
          retention-days: 7

  live:
    needs: version
    uses: ./.github/workflows/live.yml
    secrets: inherit

  publish:
    needs: [version, templates, live]
    if: needs.version.outputs.version
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
    env:
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d

      - name: Build and publish 'hud' to PyPI
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.version.outputs.version }}
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          uv build
          uv publish --check-url https://pypi.org/simple/

      - name: Tag the published commit
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      # docs.hud.ai builds the SDK tab from the docs branch.
      - name: Point docs at this release
        if: needs.version.outputs.newest
        run: git push --force origin "${GITHUB_SHA}:refs/heads/docs"

      - name: Draft the GitHub release for its notes
        if: inputs.version
        env:
          GH_TOKEN: ${{ github.token }}
          NEWEST: ${{ needs.version.outputs.newest }}
        run: |
          flags=()
          [ "$NEWEST" = true ] || flags=(--latest=false)
          gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes "" "${flags[@]}"
