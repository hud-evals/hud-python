name: Release

on:
  release:
    types: [published]

jobs:
  deploy:
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Only 'hud' is published. The old 'hud-python' name is closed off by a
      # final PyPI release (0.6.10) that refuses to install and points at 'hud'.
      - name: Build and publish 'hud' to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          uv build
          uv publish

      # docs.hud.ai builds the SDK tab from the docs branch. Prereleases stay
      # off it: the branch tracks the latest stable release.
      - name: Point docs at this release
        if: ${{ !github.event.release.prerelease }}
        run: |
          git push --force origin "${GITHUB_SHA}:refs/heads/docs"
