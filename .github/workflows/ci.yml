name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "*" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} --with=".[dev]" pytest --cov --cov-report=''

  templates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: [coding, cua]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install template with the SDK from this checkout
        working-directory: environments/${{ matrix.template }}
        run: |
          uv sync --all-extras
          uv pip install -e ../..

      - name: Run template checks
        working-directory: environments/${{ matrix.template }}
        run: |
          uv run --no-sync ruff format . --check
          uv run --no-sync ruff check .
          uv run --no-sync pytest -q

  lint-ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run ruff
        run: |
          uv run --with=".[dev]" ruff format . --check
          uv run --with=".[dev]" ruff check .

  lint-pyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run pyright
        run: uv run --with=".[dev]" pyright
