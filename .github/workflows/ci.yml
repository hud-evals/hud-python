name: CI

on:
  push:
    branches: [main]
    paths: &code
      - "hud/**"
      - "tests/**"
      - "environments/**"
      - "cookbooks/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths: *code
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} --all-extras pytest -n auto

  lint-ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Run ruff
        run: |
          uv run --with=".[dev]" ruff format . --check
          uv run --with=".[dev]" ruff check .

  lint-ty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Run ty
        run: >-
          uv run --extra dev --extra train --extra modal --extra daytona
          ty check --error-on-warning

  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      # Ubuntu 24.04 runners block unprivileged user namespaces through AppArmor;
      # environments' bubblewrap sandboxes need them, as they have on HUD's hosts.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run Docker scenarios
        run: >-
          uv run --python 3.12 --all-extras
          pytest -m "e2e and docker" --ignore tests/integrations/harbor
          -n 4 --timeout 1800 --durations 20

  sandbox:
    name: Sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUD_API_KEY: ${{ secrets.HUD_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      # Ubuntu 24.04 runners block unprivileged user namespaces through AppArmor;
      # environments' bubblewrap sandboxes need them, as they have on HUD's hosts.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Environments run in containers with HUD's seccomp profile, so the
      # sandbox scenarios run there too, as root, with bubblewrap installed.
      - name: Run sandbox scenarios in a container
        run: >-
          docker run --rm
          --security-opt seccomp=hud/eval/docker-seccomp.json
          --security-opt systempaths=unconfined
          --security-opt apparmor=unconfined
          --volume "$PWD:/src" --workdir /src
          --env UV_PROJECT_ENVIRONMENT=/opt/venv
          --env HUD_API_KEY
          python:3.12-bookworm
          sh -c 'apt-get update -qq && apt-get install -y -qq bubblewrap openssh-client >/dev/null
          && pip install -q "uv>=0.12.2"
          && uv run --all-extras pytest -m "e2e and sandbox" -n 4 --timeout 600'

  cookbooks:
    name: Cookbooks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Check cookbooks
        run: >-
          uv run --python 3.12 --all-extras
          pytest tests/e2e/test_cookbooks.py -m e2e -n 4 --timeout 1200 --durations 20
