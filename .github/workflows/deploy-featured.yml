name: Request featured template deployment

on:
  push:
    branches: [main]
    paths:
      - 'environments/**'
      - 'hud/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/deploy-featured.yml'

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'hud-evals/hud-python'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request an SDK main deployment through the platform workflow
        env:
          GH_TOKEN: ${{ secrets.HUD_FEATURED_DEPLOY_TOKEN }}
          SDK_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo '::error::HUD_FEATURED_DEPLOY_TOKEN must allow Actions write on hud-monorepo'; exit 1; }
          gh workflow run deploy-featured.yml \
            --repo hud-evals/hud-monorepo --ref main \
            --raw-field sdk_sha="$SDK_SHA"
