services:
  main:
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080"]
      interval: 100ms
      timeout: 2s
      retries: 50
  workspace:
    image: ${SIDECAR_IMAGE:-python:3.11-alpine}
    command: ["sh", "-c", "python -m http.server 5678 & exec python -m http.server 5679"]
    expose: ["5678", "5679"]
