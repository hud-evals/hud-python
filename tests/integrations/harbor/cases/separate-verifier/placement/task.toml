artifacts = ["/tmp/agent.patch"]

[environment]
cpus = 2
memory_mb = 2048
build_timeout_sec = 600

[verifier]
environment_mode = "separate"
timeout_sec = 30

[verifier.environment]
cpus = 4
memory_mb = 1024
build_timeout_sec = 1200
gpus = 1
gpu_types = ["T4"]

[[verifier.collect]]
service = "redis"
command = "redis-cli save"
timeout_sec = 10
