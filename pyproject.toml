[project]
name = "hud"
dynamic = ["version"]
description = "SDK for the HUD platform."
readme = "README.md"
requires-python = ">=3.11, <3.13"
authors = [
{ name = "HUD", email = "founders@hud.ai" },
]
license = { file = "LICENSE" }
dependencies = [
    "httpx>=0.23.0,<1",
    "httpx2>=2.0.0,<3",
    "packaging>=21.0",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.2,<3",
    "python-dotenv>=1.0,<2",
    "mcp>=2.2.0,<3",
    "fastmcp==4.1.2",
    "openai>=2.45.0",
    "anthropic>=2.1,<3",
    "google-genai>=2.30.1",
    "typer==0.29.0",
    "rich>=13.0.0",
    "questionary==2.1.0",
    "prompt-toolkit==3.0.51",
    "asyncssh>=2.23.0",
    "asyncvnc>=1.3.0",
    "pillow>=11.0.0",
    "websockets>=15.0.1",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
"Homepage" = "https://github.com/hud-evals/hud-python"
"Bug Tracker" = "https://github.com/hud-evals/hud-python/issues"
"Documentation" = "https://docs.hud.ai"

[project.scripts]
hud = "hud.cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "hud/version.py"

[tool.hatch.build]
exclude = [
    "docs/",
    "cookbooks/",
    "environments/",
    "hud-python/",
    "**/checkpoints/",
    "**/*.safetensors",
    "**/*.ckpt",
    "**/*.pth",
]

[tool.hud.clone]
title = "🚀 Welcome to HUD SDK!"
message = """[bold cyan]Thanks for using the hud SDK![/bold cyan]

[yellow]Quick Start:[/yellow]
• Install dependencies: [green]uv sync[/green]
• Try the CLI: [green]hud --help[/green]
• Read the docs: [green]https://docs.hud.ai[/green]

[dim]For runnable recipes, check out the [cyan]cookbooks/[/cyan] directory.[/dim]

[bold]Happy coding! 🎉[/bold]"""
style = "blue"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
include = [
    "hud/**",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml"
]
exclude = [
    "*/__pycache__/",
    "**/*.safetensors",
    "**/*.ckpt",
    "**/*.pth",
    "*.pyc",
    "*.pyo",
    "*~",
    ".DS_Store"
]

[tool.hatch.build.targets.wheel]
packages = ["hud"]

[tool.hatch.build.targets.wheel.force-include]
"hud/py.typed" = "hud/py.typed"
"hud/eval/docker-seccomp.json" = "hud/eval/docker-seccomp.json"

[project.optional-dependencies]
bedrock = [
    "anthropic[bedrock]>=2.1,<3",
]

robot = [
    "numpy>=1.24",
    "openpi-client>=0.1.2",
    "av>=12",
    "gymnasium>=1.0",
]

modal = [
    "modal>=1.0",
]

daytona = [
    "daytona>=0.100",
]

train = [
    "torch>=2",
]

[dependency-groups]
dev = [
    "ruff==0.16.1",
    "pytest>=8.1.1",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-xdist",
    "pytest-timeout",
    "dirty-equals",
    "ty==0.0.67",
]

[tool.uv]
required-version = ">=0.12.2"
exclude-newer = "1 day"

[tool.ruff]
target-version = "py311"
line-length = 100
lint.select = [
    "I",
    "F",
    "ANN",
    "Q",
    "ASYNC",
    "TID",
    "RSE",
    "G",
    "B",
    "E",
    "W",
    "PIE",
    "S",
    "PERF",
    "PLC",
    "UP",
    "SIM",
    "INP",
    "T20",
    "PYI",
    "TCH",
    "T10",
    "RUF",
    "SLF",
]
lint.ignore = [
    "ANN401",
    "W293",
    "PLC0415",
    "S101",
    "S603",
    "E731",
]

[tool.ruff.lint.extend-per-file-ignores]
"**/tests/**/*.py" = ["PYI", "B", "S", "ANN"]
"!tests/**/*.py" = ["SLF001"]
"hud/environment/robot/**" = ["T201"]
"hud/agents/robot/**" = ["T201"]
"hud/capabilities/robot.py" = ["T201"]
"hud/telemetry/lerobot.py" = ["T201"]
"*.ipynb" = ["ALL"]
"**/cookbooks/**/*.py" = ["ALL"]


[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ty.src]
include = ["hud", "tests"]

[tool.ty.rules]
blanket-ignore-comment = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsupported-dynamic-base = "warn"

[tool.ty.analysis]
respect-type-ignore-comments = false
strict-equality-semantics = true

[tool.coverage.run]
source = ["hud"]
patch = ["subprocess"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise AssertionError",
    "raise NotImplementedError",
    "pass",
    "pytest.mark.skip",
    "@(typing\\.)?overload",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "class .*\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not e2e'"
timeout = 120
markers = [
    "e2e: needs something outside the test process; runs only when selected with -m",
    "docker: needs a running Docker daemon",
    "modal: needs a Modal account (a token in the environment or ~/.modal.toml)",
    "lerobot: needs the lerobot[dataset] package",
    "sandbox: needs Linux, root, and bubblewrap",
    "live: needs a real HUD account (HUD_API_KEY) and spends credits",
    "hosted: deploys to and runs on the HUD platform",
]
