[project]
name = "hud"
dynamic = ["version"]
description = "SDK for the HUD platform."
readme = "README.md"
requires-python = ">=3.11, <3.13"
authors = [
{ name = "HUD", email = "founders@hud.ai" },
]
license = { file = "LICENSE" }
dependencies = [
    "httpx2>=2.0.0,<3",
    "packaging>=21.0",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.2,<3",
    "typing-extensions>=4.16,<5",
    "python-dotenv>=1.0,<2",
    "mcp>=2.2.0,<3",
    "fastmcp>=4.1.2,<4.2",
    "openai>=2.45.0,<4",
    "anthropic>=2.1,<3",
    "google-genai>=3.0.0,<4",
    "typer>=0.29.0,<0.30",
    "rich>=13.0.0,<16",
    "asyncssh>=2.23.0,<3",
    "cryptography>=43,<51",
    "keysymdef>=1.2,<2",
    "pillow>=11.0.0,<14",
    "websockets>=15.0.1,<18",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
"Homepage" = "https://github.com/hud-evals/hud-python"
"Bug Tracker" = "https://github.com/hud-evals/hud-python/issues"
"Documentation" = "https://docs.hud.ai"

[project.scripts]
hud = "hud.cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "hud/version.py"

[tool.hatch.build.targets.sdist]
include = [
    "hud/**",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml"
]
exclude = [
    "*/__pycache__/",
    "**/*.safetensors",
    "**/*.ckpt",
    "**/*.pth",
    "*.pyc",
    "*.pyo",
    "*~",
    ".DS_Store"
]

[tool.hatch.build.targets.wheel]
packages = ["hud"]

[project.optional-dependencies]
bedrock = [
    "anthropic[bedrock]>=2.1,<3",
]

robot = [
    "numpy>=1.24,<3",
    "openpi-client>=0.1.2,<1",
    "av>=12,<20",
    "gymnasium>=1.0,<2",
]

modal = [
    "modal>=1.0,<2",
]

daytona = [
    "daytona>=0.231,<1",
]

train = [
    "torch>=2,<3",
]

[dependency-groups]
dev = [
    "ruff==0.17.4",
    "pytest>=8.1.1",
    "pytest-asyncio",
    "pytest-xdist",
    "pytest-timeout",
    "dirty-equals",
    "ty==0.0.101",
]

[tool.uv]
required-version = ">=0.12.2"
exclude-newer = "1 day"

[tool.ruff]
target-version = "py311"
line-length = 100
lint.select = [
    "I",
    "F",
    "ANN",
    "Q",
    "ASYNC",
    "TID",
    "RSE",
    "G",
    "B",
    "E",
    "W",
    "PIE",
    "S",
    "PERF",
    "PLC",
    "UP",
    "SIM",
    "INP",
    "T20",
    "PYI",
    "TCH",
    "T10",
    "RUF",
    "SLF",
]
lint.ignore = [
    "ANN401",
    "W293",
    "S101",
    "S603",
    "E731",
]

[tool.ruff.lint.extend-per-file-ignores]
"**/tests/**/*.py" = ["PYI", "B", "S", "ANN"]
# Typer reads command annotations at runtime.
"hud/cli/*.py" = ["TC003"]
"hud/environment/robot/**" = ["T201"]
# Imports inside functions: optional extras and provider SDKs load where they are used.
"hud/runtime/daytona.py" = ["PLC0415"]
"hud/runtime/modal.py" = ["PLC0415"]
"hud/environment/robot/gym.py" = ["PLC0415"]
"hud/train/client.py" = ["PLC0415"]
"hud/utils/gateway.py" = ["PLC0415"]
"hud/clients/client.py" = ["PLC0415"]
"tests/conftest.py" = ["PLC0415"]
"tests/runtime/test_runtimes.py" = ["PLC0415"]
# Imports inside functions: modules that import each other (shapes and agents, environment and engine).
"hud/types.py" = ["PLC0415"]
"hud/environment/__init__.py" = ["PLC0415"]
"hud/environment/env.py" = ["PLC0415"]
"hud/eval/task.py" = ["PLC0415"]
# Imports inside functions: Windows-only modules.
"hud/environment/workspace.py" = ["PLC0415"]
"hud/agents/robot/**" = ["T201"]
"*.ipynb" = ["ALL"]
"**/cookbooks/**/*.py" = ["ALL"]


[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel", "fastmcp.tools.Tool"]

[tool.ty.src]
include = ["hud", "tests"]

[tool.ty.rules]
blanket-ignore-comment = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsupported-dynamic-base = "warn"

[tool.ty.analysis]
respect-type-ignore-comments = false
strict-equality-semantics = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not e2e'"
timeout = 120
markers = [
    "e2e: needs something outside the test process; runs only when selected with -m",
    "docker: needs a running Docker daemon",
    "modal: needs a Modal account (a token in the environment or ~/.modal.toml)",
    "lerobot: needs the lerobot[dataset] package",
    "sandbox: needs Linux, root, and bubblewrap",
    "live: needs a real HUD account (HUD_API_KEY) and spends credits",
    "hosted: deploys to and runs on the HUD platform",
]
