[project]
name = "argument-hints-env"
version = "0.1.0"
description = "Argument-hints environment: prompt, data-file attachments, and rubric grading via console form hints (HUD v6)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "hud[agents]>=0.6.13",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "ruff==0.11.2"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B", "I", "C4", "UP"]
ignore = ["E501"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build]
# Flat top-level modules, not a package dir.
only-packages = false
include = ["env.py", "tasks.py"]
