[project]
name = "argument-hints-env"
version = "0.1.0"
description = "Argument-hints environment: prompt, data-file attachments, and rubric grading via console form hints (HUD v6)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "hud>=0.6.13",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "ruff==0.17.4"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B", "I", "C4", "UP"]
ignore = ["E501"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
