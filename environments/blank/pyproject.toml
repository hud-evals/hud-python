[project]
name = "blank-env"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = ["hud"]

[tool.uv]
package = false

[tool.uv.sources]
hud = { git = "https://github.com/hud-evals/hud-python.git", branch = "main" }

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B", "I", "C4", "UP"]
