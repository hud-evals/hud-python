[project]
name = "coding-env"
version = "0.1.0"
description = "Coding environment with isolated repository grading and hidden JUnit tests"
requires-python = ">=3.11,<3.13"
dependencies = [
    "blinker==1.5",
    "click>=8.0",
    "hud>=0.6.13",
    "itsdangerous>=2.0",
    "jinja2>=3.0",
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<2",
    "werkzeug>=2.2.2,<3",
]

[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [ "ruff==0.11.2",]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [ "E", "F", "B", "I", "C4", "UP",]
ignore = [ "E501",]
fixable = [ "ALL",]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.hatch.build.targets.wheel]
packages = [ ".",]
