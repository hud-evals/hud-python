[project]
name = "coding-env"
version = "0.1.0"
description = "Native coding environment (HUD v6) with hermetic diff grading; generic tasks and SWE-bench Pro as flavors"
requires-python = ">=3.11,<3.13"
dependencies = [ "hud>=0.6.11", "httpx>=0.27.0", "pytest>=8.0.0", "pytest-asyncio>=0.23.0",]

[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [ "ruff==0.11.2",]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [ "E", "F", "B", "I", "C4", "UP",]
ignore = [ "E501",]
fixable = [ "ALL",]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
markers = [ "integration: requires Docker and built instance images",]

[tool.hatch.build.targets.wheel]
packages = [ ".",]
