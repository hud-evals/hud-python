[project]
name = "cua-env"
version = "0.1.0"
description = "CUA environment: a virtual desktop served over an rfb capability for computer-use agents (HUD v6)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "hud>=0.6.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "ruff==0.17.4"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.hud]
image = "hud-cua:dev"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "C4", "UP"]
ignore = ["E501"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
