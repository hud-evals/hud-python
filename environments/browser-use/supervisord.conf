[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:xvfb]
command=/usr/bin/env -i HOME=/home/pwuser USER=pwuser LOGNAME=pwuser LANG=C.UTF-8 PATH=/usr/bin:/bin /usr/bin/Xvfb :1 -screen 0 1400x850x24
user=pwuser
directory=/home/pwuser
priority=10
autorestart=true
startsecs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:xfce]
command=/usr/bin/env -i HOME=/home/pwuser USER=pwuser LOGNAME=pwuser LANG=C.UTF-8 PATH=/usr/bin:/bin DISPLAY=:1 NO_AT_BRIDGE=1 /usr/bin/dbus-launch --exit-with-session /usr/bin/xfce4-session
user=pwuser
directory=/home/pwuser
priority=20
autorestart=true
startsecs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:chromium]
command=/usr/bin/env -i HOME=/home/pwuser USER=pwuser LOGNAME=pwuser LANG=C.UTF-8 PATH=/usr/bin:/bin DISPLAY=:1 NO_AT_BRIDGE=1 /usr/local/bin/hud-chromium --disable-dev-shm-usage --no-first-run --start-maximized --window-size=1400,850 --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 --user-data-dir=/home/pwuser/.config/hud-chromium about:blank
user=pwuser
directory=/home/pwuser
priority=30
autorestart=true
startsecs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:x11vnc]
command=/usr/bin/env -i HOME=/home/pwuser USER=pwuser LOGNAME=pwuser LANG=C.UTF-8 PATH=/usr/bin:/bin DISPLAY=:1 /usr/bin/x11vnc -display :1 -rfbport 5900 -forever -shared -nopw -localhost
user=pwuser
directory=/home/pwuser
priority=40
autorestart=true
startsecs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:hud]
command=/usr/local/bin/hud serve /app/env.py --host 0.0.0.0 --port 8765
user=root
priority=50
autorestart=true
startsecs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
