[project]
name = "robot-libero"
version = "0.1.0"
description = "LIBERO robot manipulation for policies and tool-calling agents (cookbook)"
requires-python = ">=3.11,<3.13"
dependencies = ["hud[robot]"]

[tool.uv]
package = false

# Track the SDK from this repo. If you copied this folder out, delete this
# block to use the released hud from PyPI.
[tool.uv.sources]
hud = { path = "../..", editable = true }

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
addopts = "-m 'not e2e'"
markers = [
    "e2e: builds the image and runs a rollout; needs Docker",
    "docker: needs a running Docker daemon",
]
