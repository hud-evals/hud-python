[project]
name = "fireworks-rl-training"
version = "0.1.0"
description = "Train on HUD rewards with Fireworks Serverless RL"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fireworks-ai[training]",
    "hud",
    "python-dotenv",
    "tinker",
    "tinker-cookbook",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest"]

[tool.uv.sources]
hud = { path = "../..", editable = true }
